name: Refresh held Caregos preview

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REFRESH_HELD_PREVIEW to regenerate the public editorial-hold preview."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: caregos-held-preview
  cancel-in-progress: false

jobs:
  refresh-held-preview:
    if: github.event.inputs.confirmation == 'REFRESH_HELD_PREVIEW'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh CMS public data
        run: |
          python scripts/fetch_cms_provider_data.py --state IL --county Sangamon
      - name: Generate due posts
        run: |
          python scripts/generate_blog.py --site-url https://caregos.com/
          python scripts/generate_sitemap.py --site-url https://caregos.com/
      - name: Validate public SEO output
        run: |
          python scripts/validate_article_quality.py
          python scripts/validate_bulk_tracking.py content/bulk-post-tracking.csv --threshold 90 --publish-ready
          python scripts/validate_cms_data.py
          python scripts/validate_public_seo.py
      - name: Hold public indexing and AdSense during editorial remediation
        run: |
          python scripts/apply_adsense_review_hold.py
      - name: Verify editorial hold output
        run: |
          python scripts/apply_adsense_review_hold.py --verify-only
      - name: Commit refreshed held preview
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog rss.xml sitemap.xml robots.txt *.html styles/data.js content/cms
            git commit -m "Refresh held Caregos preview"
            git push
          else
            echo "No held-preview changes."
          fi
